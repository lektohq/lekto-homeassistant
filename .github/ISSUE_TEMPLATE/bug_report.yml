---
name: Bug report
description: Report a bug in the Lekto integration for Home Assistant
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: |
        The Lekto integration is a side project, so a reply can take a while, but every issue
        gets one. A pull request with a fix speeds things up a lot.

        Please use made-up values in examples and logs: no real names, IBANs, addresses, hosts or
        tokens.

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: What happens?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: The steps in Home Assistant
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        What Home Assistant logs for `custom_components.lekto` (with debug logging enabled for the
        integration)
      render: text

  - type: input
    id: integration-version
    attributes:
      label: Integration version
      placeholder: e.g. 0.1.0
    validations:
      required: true

  - type: input
    id: homeassistant-version
    attributes:
      label: Home Assistant version
      placeholder: e.g. 2026.11.2
    validations:
      required: true

  - type: input
    id: lekto-version
    attributes:
      label: Lekto version
      placeholder: e.g. 0.15.5
    validations:
      required: true
