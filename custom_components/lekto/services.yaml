upload:
  fields:
    config_entry_id: &config_entry_id
      required: true
      selector:
        config_entry:
          integration: lekto
    file:
      required: true
      selector:
        media:
          accept:
            - application/pdf
            - image/jpeg
            - image/png
            - image/tiff
            - message/rfc822
    name:
      required: false
      selector:
        text:
    space:
      required: false
      selector:
        text:
fetch_mail:
  fields:
    config_entry_id: *config_entry_id
    mailbox:
      required: false
      selector:
        text:
count:
  fields:
    config_entry_id: *config_entry_id
    inbox: &inbox
      required: false
      selector:
        boolean:
    lane: &lane
      required: false
      selector:
        select:
          options:
            - green
            - yellow
            - red
            - processing
          multiple: true
          translation_key: lane
    contact: &names
      required: false
      selector:
        text:
          multiple: true
    document_type: *names
    tag: *names
    space: *names
    date_from: &date
      required: false
      selector:
        date:
    date_to: *date
list_documents:
  fields:
    config_entry_id: *config_entry_id
    inbox: *inbox
    lane: *lane
    contact: *names
    document_type: *names
    tag: *names
    space: *names
    date_from: *date
    date_to: *date
    limit:
      required: false
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    fields:
      required: false
      selector:
        select:
          options:
            - lane
            - contact
            - document_type
            - tags
            - space
          multiple: true
          translation_key: document_fields
